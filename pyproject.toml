[project]
name = "lftrace"
version = "0.1.0"
description = "Show a Langfuse trace as a diagram in your terminal"
readme = "README.md"
authors = [
    { name = "Fabio Souto", email = "fsoutomoure@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["langfuse", "tracing", "llm", "agents", "mermaid", "terminal"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "langfuse>=4.7",
    "termaid[rich]>=0.9.1",
]

[project.scripts]
lftrace = "lftrace.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["lftrace", "shared"]
